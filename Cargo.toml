[package]
name = "tun2proxy"
version = "0.8.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/tun2proxy/tun2proxy"
homepage = "https://github.com/tun2proxy/tun2proxy"
authors = ["B. Blechschmidt", "ssrlive"]
description = "Tunnel interface to proxy"
readme = "README.md"
rust-version = "1.85"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "tun2proxy-bin"
path = "src/bin/main.rs"

[[bin]]
name = "udpgw-server"
path = "src/bin/udpgw_server.rs"
required-features = ["udpgw"]

[features]
default = ["udpgw", "unshare", "setup", "http-digest"]
udpgw = []
unshare = ["tokio/process"]
setup = ["dep:tproxy-config"]
http-digest = ["dep:digest_auth"]

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
    "suggestions",
] }
ctrlc2 = { version = "4.0.0", default-features = false, features = [
    "async",
    "termination",
] }
digest_auth = { version = "0.3.1", optional = true }
env_logger = { version = "0.11.11", default-features = false, features = [
    "humantime",
] }
httparse = "1.10.1"
ipstack = { version = "1.0.1" }
log = { version = "0.4.34", default-features = false, features = [
    "std",
    "serde",
] }
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
socks5-impl = { version = "0.9.8", default-features = false, features = [
    "tokio",
    "serde",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
] }
tokio-util = "0.7.19"
tproxy-config = { version = "^7.0.9", default-features = false, optional = true }
tun = { version = "0.8.14", features = ["async"] }
udp-stream = { version = "0.0.12", default-features = false }

[target.'cfg(target_os="android")'.dependencies]
android_logger = "0.15.1"
jni = { version = "0.22.4", default-features = false }

[target.'cfg(target_os="windows")'.dependencies]
windows-service = "0.8.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31.3", default-features = false, features = [
    "fs",
    "socket",
    "uio",
] }

[build-dependencies]
serde_json = "1.0.151"

# [profile.release]
# strip = "symbols"
